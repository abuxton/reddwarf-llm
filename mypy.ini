[mypy]
python_version = 3.10
strict = True
warn_unused_ignores = True
disallow_any_unimported = True
warn_return_any = True
warn_redundant_casts = True
warn_unused_configs = True
exclude = tests/fixtures/|data/

[mypy-torch.*]
ignore_missing_imports = True

[mypy-transformers.*]
ignore_missing_imports = True

[mypy-bitsandbytes.*]
ignore_missing_imports = True
